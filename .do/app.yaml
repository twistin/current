name: current-app
region: fra

ingress:
  rules:
    - component:
        name: frontend
      match:
        path:
          prefix: /
    - component:
        name: backend
      match:
        path:
          prefix: /api

databases:
  - name: db
    engine: PG
    version: "15"
    production: false

services:
  - name: backend
    github:
      repo: twistin/current
      branch: main
      deploy_on_push: true
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: CORS_ALLOWED_ORIGIN
        scope: RUN_TIME
        value: ${frontend.PUBLIC_URL}
      - key: RUST_LOG
        scope: RUN_TIME
        value: info

static_sites:
  - name: frontend
    github:
      repo: twistin/current
      branch: main
      deploy_on_push: true
    source_dir: frontend
    build_command: npm run build
    output_dir: dist
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: ${backend.PUBLIC_URL}
