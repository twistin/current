[package]
name    = "current-domain"
version = "0.1.0"
edition = "2021"

# Cero dependencias de base de datos ni de red.
# Si alguien intenta añadir sqlx aquí, es un error de diseño.
[dependencies]
uuid   = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde  = { version = "1", features = ["derive"] }
